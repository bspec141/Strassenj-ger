name: Bauen & veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 1 * *'   # monatlich frische Strassendaten
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: month
        run: echo "key=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      # Letzte Strassendaten wiederherstellen (auch ältere als Notfall-Reserve)
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: public/data/roads.json
          key: roads-zh-v4-${{ steps.month.outputs.key }}
          restore-keys: |
            roads-zh-v4-
            roads-zh-v3-
      - name: Strassennetz Kanton Zürich laden (OpenStreetMap)
        id: fetch
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 40
        run: |
          node scripts/build-roads.mjs public/data/roads.new.json
          mv public/data/roads.new.json public/data/roads.json
      - name: Neue Strassendaten speichern
        if: steps.fetch.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: public/data/roads.json
          key: roads-zh-v4-${{ steps.month.outputs.key }}
      - name: Strassendaten vorhanden?
        run: |
          test -s public/data/roads.json || { echo "::error::Keine Strassendaten – OpenStreetMap-Server später erneut versuchen"; exit 1; }
          if [ "${{ steps.fetch.outcome }}" = "failure" ]; then echo "::warning::OpenStreetMap nicht erreichbar – verwende ältere Strassendaten"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
